[project]
name = "breachgraph"
version = "0.1.0"
description = "BreachGraph AI: cloud identity attack-path analysis with explainable AI."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
breachgraph = "breachgraph.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["breachgraph*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
