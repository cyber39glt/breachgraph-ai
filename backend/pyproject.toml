[project]
name = "breachgraph"
version = "0.1.0"
description = "BreachGraph AI: cloud identity attack-path analysis with explainable AI."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
breachgraph = "breachgraph.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["breachgraph*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
pythonpath = ["."]
